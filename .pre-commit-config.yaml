repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.12.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic-settings, types-PyYAML]
        args: [--ignore-missing-imports]
        exclude: ^scripts/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-merge-conflict

  # Fleet Biome gate: repo-root entry that delegates to scripts/pre-commit-biome.ps1.
  # Runs ONLY via `powershell.exe -File` (never bare pwsh) per NAKED_PC_INSTALL_STANDARD.
  - repo: local
    hooks:
      - id: biome-ci
        name: biome ci (web_sota)
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-biome.ps1
        language: system
        pass_filenames: false
        always_run: true
